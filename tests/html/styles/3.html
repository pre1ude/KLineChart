<!DOCTYPE html>
<html lang="en" >
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="kline time-line candlestick stock chart canvas k线 行情 蜡烛图 分时图 技术指标 图表"/>
    <meta name="description" content="shape test"/>
    <script type="text/javascript" src="../../../dist/umd/klinecharts.js"></script>
    <script type="text/javascript" src="../../js/dataSource.js"></script>
    <link rel="stylesheet" type="text/css" href="../../css/chart.css"/>
    <title>Styles -- Api Settings</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="chart" style="background-color: #222222"></div>
    <script>
      window.onload = function () {
        var chart = klinecharts.init('chart')
        chart.setStyles({
          grid: {
            horizontal: {
              color: '#292929'
            },
            vertical: {
              color: '#292929'
            }
          },
          candle: {
            priceMark: {
              high: {
                color: '#929AA5'
              },
              low: {
                color: '#929AA5'
              }
            },
            tooltip: {
              text: {
                color: '#929AA5'
              }
            }
          },
          indicator: {
            tooltip: {
              text: {
                color: '#929AA5'
              }
            }
          },
          xAxis: {
            axisLine: {
              color: '#333333'
            },
            tickLine: {
              color: '#333333'
            },
            tickText: {
              color: '#929AA5'
            }
          },
          yAxis: {
            axisLine: {
              color: '#333333'
            },
            tickLine: {
              color: '#333333'
            },
            tickText: {
              color: '#929AA5'
            }
          },
          separator: {
            color: '#333333'
          },
          crosshair: {
            horizontal: {
              line: {
                color: '#666666'
              },
              text: {
                backgroundColor: '#373a40'
              }
            },
            vertical: {
              line: {
                color: '#666666'
              },
              text: {
                backgroundColor: '#373a40'
              }
            }
          }
        })
        chart.applyNewData(generated())
      }
    </script>
  </body>
</html>
