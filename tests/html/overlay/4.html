<!DOCTYPE html>
<html lang="en" >
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="kline time-line candlestick stock chart canvas k线 行情 蜡烛图 分时图 技术指标 图表"/>
    <meta name="description" content="shape test"/>
    <script type="text/javascript" src="../../../dist/umd/klinecharts.js"></script>
    <script type="text/javascript" src="../../js/dataSource.js"></script>
    <link rel="stylesheet" type="text/css" href="../../css/chart.css"/>
    <title>Overlay -- Use built-in overlays</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="chart"></div>
    <script>
      window.onload = function () {
        var chart = klinecharts.init('chart')
        var kdjPaneId = chart.createIndicator('KDJ')
        var dataList = generated()
        chart.applyNewData(dataList)

        klinecharts.registerOverlay({
          name: 'circle',
          needDefaultPointFigure: false,
          needDefaultXAxisFigure: false,
          needDefaultYAxisFigure: false,
          totalStep: 2,
          onMouseEnter: function ({ overlay, point, event }) {
            console.log('onMouseEnter', overlay, point, event)
          },
          onMouseLeave: function ({ overlay, point, event }) {
            console.log('onMouseLeave', overlay, point, event)
          },
          onClick: function ({ overlay, point, event }) {
            console.log('onClick', overlay, point, event)
          },
          createPointFigures: function ({ overlay, coordinates }) {
            if (coordinates.length === 1) {
              return [
                {
                  key: 'circle',
                  type: 'circle',
                  attrs: {
                    ...coordinates[0],
                    r: 20
                  },
                  styles: {
                    style: 'fill',
                    color: '#FF0000',
                    // borderColor: 'blue',
                    // borderSize: 5
                  }
                },
              ]
            }
            return []
          }
        })
        // Create on main
        chart.createOverlay({
          name: 'circle',
          // extendData: '1111111111',
          points: [
            { timestamp: dataList[dataList.length - 20].timestamp, value: dataList[dataList.length - 20].high },
            // { timestamp: dataList[dataList.length - 19].timestamp, value: dataList[dataList.length - 20].high },
          ]
        })
         // Create on sub
        // chart.createOverlay({
        //   name: 'simpleAnnotation',
        //   extendData: '22222222222',
        //   points: [{ timestamp: dataList[dataList.length - 20].timestamp, value: 40 }]
        // }, kdjPaneId)
      }
    </script>
  </body>
</html>
