<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="keywords" content="kline time-line candlestick stock chart canvas k线 行情 蜡烛图 分时图 技术指标 图表"/>
    <meta name="description" content="Overlay refactor test - comprehensive test for OverlayView refactoring"/>
    <link rel="stylesheet" type="text/css" href="../../css/chart.css"/>
    <title>Overlay Refactor Test - Comprehensive Test</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
      }
      #chart {
        height: 600px;
      }
      .controls {
        margin-bottom: 20px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 4px;
      }
      .controls h3 {
        margin-top: 0;
      }
      .button-group {
        margin: 10px 0;
      }
      button {
        margin: 5px;
        padding: 8px 16px;
        cursor: pointer;
        background: #1890ff;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background: #40a9ff;
      }
      .status {
        margin-top: 10px;
        padding: 10px;
        background: #e6f7ff;
        border-left: 3px solid #1890ff;
        border-radius: 2px;
      }
      .test-section {
        margin: 15px 0;
        padding: 10px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
      }
      .test-section h4 {
        margin-top: 0;
        color: #1890ff;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div class="controls">
      <h3>🧪 Overlay Refactor Test Suite</h3>
      <p>测试 OverlayView 重构后的功能完整性</p>

      <div class="test-section">
        <h4>1. Main Pane Overlays (主图覆盖物)</h4>
        <div class="button-group">
          <button onclick="testMainPaneText()">创建文本标注</button>
          <button onclick="testMainPaneLine()">创建趋势线</button>
          <button onclick="testMainPaneRect()">创建矩形</button>
          <button onclick="testMainPaneCircle()">创建圆形</button>
          <button onclick="testHorizontalRayLine()">创建水平射线</button>
          <button onclick="testParallelogram()">创建平行四边形</button>
          <button onclick="testAnyWaves()">创建Anywaves</button>
        </div>
      </div>

      <div class="test-section">
        <h4>2. Sub Pane Overlays (副图覆盖物)</h4>
        <div class="button-group">
          <button onclick="testSubPaneText()">副图文本标注</button>
          <button onclick="testSubPaneLine()">副图趋势线</button>
        </div>
      </div>

      <div class="test-section">
        <h4>3. Axis Overlays (坐标轴覆盖物)</h4>
        <div class="button-group">
          <button onclick="testXAxisOverlay()">X轴标签测试</button>
          <button onclick="testYAxisOverlay()">Y轴标签测试</button>
          <button onclick="testCustomXAxisFigures()">自定义X轴Figures</button>
        </div>
      </div>

      <div class="test-section">
        <h4>5. zLevel Tests (层级测试)</h4>
        <div class="button-group">
          <button onclick="testZLevelBasic()">基础层级测试</button>
          <button onclick="testZLevelHover()">Hover 层级测试</button>
          <button onclick="testZLevelMultiple()">多个 Overlay 层级测试</button>
        </div>
      </div>

      <div class="test-section">
        <h4>6. Batch Operations (批量操作)</h4>
        <div class="button-group">
          <button onclick="createMultipleOverlays()">创建多个覆盖物</button>
          <button onclick="clearAllOverlays()">清除所有覆盖物</button>
        </div>
      </div>

      <div class="status" id="status">
        状态: 就绪
      </div>
    </div>

    <div id="chart"></div>

    <script type="module">
      import { init, registerOverlay } from '../../../dist/index.js'
      import { generated } from '../../js/dataSource.js'

      let chart
      let dataList
      let kdjPaneId
      let overlayCount = 0

      function updateStatus(message) {
        document.getElementById('status').textContent = '状态: ' + message
        console.log('✅', message)
      }

      window.onload = function () {
        chart = init('chart')
        kdjPaneId = chart.createIndicator('KDJ')
        dataList = generated()
        chart.applyNewData(dataList)
        updateStatus('图表初始化完成')
      }

      // 1. Main Pane Tests
      window.testMainPaneText = function() {
        const overlay = chart.createOverlay({
          name: 'textLog',
          extendData: {
            text: `主图文本 #${++overlayCount}`
          },
          points: [{
            timestamp: dataList[dataList.length - 20].timestamp,
            value: dataList[dataList.length - 20].high
          }]
        })
        updateStatus(`创建主图文本标注 #${overlayCount}`)
      }

      window.testMainPaneLine = function() {
        const overlay = chart.createOverlay({
          name: 'segment',
          points: [
            { timestamp: dataList[dataList.length - 30].timestamp, value: dataList[dataList.length - 30].low },
            { timestamp: dataList[dataList.length - 10].timestamp, value: dataList[dataList.length - 10].high }
          ]
        })
        updateStatus(`创建主图趋势线 #${++overlayCount}`)
      }

      window.testMainPaneRect = function() {
        const overlay = chart.createOverlay({
          name: 'rect',
          points: [
            { timestamp: dataList[dataList.length - 40].timestamp, value: dataList[dataList.length - 40].high },
            { timestamp: dataList[dataList.length - 20].timestamp, value: dataList[dataList.length - 20].low }
          ]
        })
        updateStatus(`创建主图矩形 #${++overlayCount}`)
      }

      window.testMainPaneCircle = function() {
        const overlay = chart.createOverlay({
          name: 'circle',
          points: [
            { timestamp: dataList[dataList.length - 25].timestamp, value: dataList[dataList.length - 25].close },
            { timestamp: dataList[dataList.length - 15].timestamp, value: dataList[dataList.length - 15].close }
          ]
        })
        updateStatus(`创建主图圆形 #${++overlayCount}`)
      }

      window.testHorizontalRayLine = function() {
        const overlay = chart.createOverlay({
          name: 'horizontalRayLine',
          points: [
            { timestamp: dataList[dataList.length - 35].timestamp, value: dataList[dataList.length - 35].close },
            { timestamp: dataList[dataList.length - 25].timestamp, value: dataList[dataList.length - 25].close }
          ]
        })
        updateStatus(`创建水平射线 #${++overlayCount} - 拖动任意控制点，两点会保持水平`)
      }

      window.testParallelogram = function() {
        const overlay = chart.createOverlay({
          name: 'parallelogram',
        })
        updateStatus(`创建平行四边形 #${++overlayCount} - 拖动前两个控制点，第一条边会保持水平`)
      }
      // window.testParallelogram = function() {
      //   const overlay = chart.createOverlay({
      //     name: 'parallelogram',
      //     points: [
      //       { timestamp: dataList[dataList.length - 50].timestamp, value: dataList[dataList.length - 50].high },
      //       { timestamp: dataList[dataList.length - 40].timestamp, value: dataList[dataList.length - 40].high },
      //       { timestamp: dataList[dataList.length - 35].timestamp, value: dataList[dataList.length - 35].low }
      //     ]
      //   })
      //   updateStatus(`创建平行四边形 #${++overlayCount} - 拖动前两个控制点，第一条边会保持水平`)
      // }

      window.testAnyWaves = function() {
        const overlay = chart.createOverlay({
          name: 'anyWaves',
        })
        updateStatus(`创建anywaves`)
      }

      // 2. Sub Pane Tests
      window.testSubPaneText = function() {
        const overlay = chart.createOverlay({
          name: 'textLog',
          extendData: `副图文本 #${++overlayCount}`,
          points: [{ timestamp: dataList[dataList.length - 20].timestamp, value: 50 }]
        }, kdjPaneId)
        updateStatus(`创建副图文本标注 #${overlayCount}`)
      }

      window.testSubPaneLine = function() {
        const overlay = chart.createOverlay({
          name: 'segment',
          points: [
            { timestamp: dataList[dataList.length - 30].timestamp, value: 30 },
            { timestamp: dataList[dataList.length - 10].timestamp, value: 70 }
          ]
        }, kdjPaneId)
        updateStatus(`创建副图趋势线 #${++overlayCount}`)
      }

      // 3. Axis Tests
      window.testYAxisOverlay = function() {
        const overlay = chart.createOverlay({
          name: 'segment',
          needDefaultXAxisFigure: true,
          // points: [
          //   { timestamp: dataList[dataList.length - 50].timestamp, value: dataList[dataList.length - 50].close },
          //   { timestamp: dataList[dataList.length - 5].timestamp, value: dataList[dataList.length - 5].close }
          // ]
        })
        updateStatus('X轴标签应该显示在底部坐标轴上')
      }

      window.testXAxisOverlay = function() {
        const overlay = chart.createOverlay({
          name: 'horizontalSegment',
          needDefaultYAxisFigure: true,
          points: [
            { timestamp: dataList[dataList.length - 30].timestamp, value: dataList[dataList.length - 30].close }
          ]
        })
        updateStatus('Y轴标签应该显示在右侧坐标轴上')
      }

      window.testCustomXAxisFigures = function() {
        // 注册一个自定义 overlay，带有自定义的 X 轴 figures
        registerOverlay({
          name: 'customXAxisOverlay',
          totalStep: 2,
          needDefaultPointFigure: true,
          needDefaultXAxisFigure: false,  // 不使用默认的，我们自己绘制
          needDefaultYAxisFigure: false,
          createFigures: ({ coordinates }) => {
            if (coordinates.length < 2) return []

            return {
              type: 'line',
              attrs: { coordinates },
              styles: {
                color: '#ff6b00',
                size: 3,
                style: 'dashed'
              }
            }
          },
          // 自定义 X 轴 figures
          createXAxisFigures: ({ overlay, coordinates, bounding }) => {
            if (coordinates.length < 2) return []

            const figures = []
            const startX = coordinates[0].x
            const endX = coordinates[1].x
            const width = endX - startX

            // 1. 绘制背景矩形（高亮区域）
            figures.push({
              type: 'rect',
              attrs: {
                x: startX,
                y: 0,
                width: width,
                height: bounding.height
              },
              styles: {
                style: 'fill',
                color: 'rgba(255, 107, 0, 0.1)'
              },
              ignoreEvent: true
            })

            // 2. 绘制左边界线
            figures.push({
              type: 'line',
              attrs: {
                coordinates: [
                  { x: startX, y: 0 },
                  { x: startX, y: bounding.height }
                ]
              },
              styles: {
                color: '#ff6b00',
                size: 2
              },
              ignoreEvent: true
            })

            // 3. 绘制右边界线
            figures.push({
              type: 'line',
              attrs: {
                coordinates: [
                  { x: endX, y: 0 },
                  { x: endX, y: bounding.height }
                ]
              },
              styles: {
                color: '#ff6b00',
                size: 2
              },
              ignoreEvent: true
            })

            // 4. 绘制开始时间标签
            const startPoint = overlay.points[0]
            if (startPoint?.timestamp) {
              figures.push({
                type: 'text',
                attrs: {
                  x: startX,
                  y: bounding.height / 2,
                  text: '开始',
                  align: 'center',
                  baseline: 'middle'
                },
                styles: {
                  color: '#ff6b00',
                  size: 12,
                  weight: 'bold',
                  backgroundColor: 'rgba(255, 255, 255, 0.9)',
                  borderColor: '#ff6b00',
                  borderSize: 1,
                  borderRadius: 2,
                  paddingLeft: 4,
                  paddingRight: 4,
                  paddingTop: 2,
                  paddingBottom: 2
                },
                ignoreEvent: true
              })
            }

            // 5. 绘制结束时间标签
            const endPoint = overlay.points[1]
            if (endPoint?.timestamp) {
              figures.push({
                type: 'text',
                attrs: {
                  x: endX,
                  y: bounding.height / 2,
                  text: '结束',
                  align: 'center',
                  baseline: 'middle'
                },
                styles: {
                  color: '#ff6b00',
                  size: 12,
                  weight: 'bold',
                  backgroundColor: 'rgba(255, 255, 255, 0.9)',
                  borderColor: '#ff6b00',
                  borderSize: 1,
                  borderRadius: 2,
                  paddingLeft: 4,
                  paddingRight: 4,
                  paddingTop: 2,
                  paddingBottom: 2
                },
                ignoreEvent: true
              })
            }

            // 6. 绘制中间的时间跨度标签
            const centerX = (startX + endX) / 2
            figures.push({
              type: 'text',
              attrs: {
                x: centerX,
                y: bounding.height / 2,
                text: `时间跨度: ${coordinates.length} 个点`,
                align: 'center',
                baseline: 'middle'
              },
              styles: {
                color: 'white',
                size: 11,
                backgroundColor: '#ff6b00',
                borderRadius: 3,
                paddingLeft: 6,
                paddingRight: 6,
                paddingTop: 3,
                paddingBottom: 3
              },
              ignoreEvent: true
            })

            return figures
          }
        })

        // 创建这个自定义 overlay
        const overlay = chart.createOverlay({
          name: 'customXAxisOverlay',
          points: [
            { timestamp: dataList[dataList.length - 60].timestamp, value: dataList[dataList.length - 60].close },
            { timestamp: dataList[dataList.length - 20].timestamp, value: dataList[dataList.length - 20].close }
          ]
        })

        overlayCount++
        updateStatus('✅ 创建了自定义 X 轴 Figures 的 overlay！点击它查看 X 轴上的自定义标签（背景高亮、边界线、开始/结束标签、时间跨度）')
      }

      // 5. zLevel Tests
      window.testZLevelBasic = function() {
        // 创建三个重叠的矩形，测试 zLevel
        const rect1 = chart.createOverlay({
          name: 'rect',
          zLevel: 1,
          points: [
            { timestamp: dataList[dataList.length - 30].timestamp, value: dataList[dataList.length - 30].high },
            { timestamp: dataList[dataList.length - 20].timestamp, value: dataList[dataList.length - 20].low }
          ],
          styles: {
            polygon: {
              color: 'rgba(255, 0, 0, 0.3)'
            }
          }
        })

        const rect2 = chart.createOverlay({
          name: 'rect',
          zLevel: 2,
          points: [
            { timestamp: dataList[dataList.length - 28].timestamp, value: dataList[dataList.length - 28].high },
            { timestamp: dataList[dataList.length - 18].timestamp, value: dataList[dataList.length - 18].low }
          ],
          styles: {
            polygon: {
              color: 'rgba(0, 255, 0, 0.3)'
            }
          }
        })

        const rect3 = chart.createOverlay({
          name: 'rect',
          zLevel: 3,
          points: [
            { timestamp: dataList[dataList.length - 26].timestamp, value: dataList[dataList.length - 26].high },
            { timestamp: dataList[dataList.length - 16].timestamp, value: dataList[dataList.length - 16].low }
          ],
          styles: {
            polygon: {
              color: 'rgba(0, 0, 255, 0.4)'
            }
          }
        })

        overlayCount += 3
        updateStatus('创建了 3 个重叠的矩形（红、绿、蓝），zLevel 分别为 1、2、3。蓝色应该在最上层。')
      }

      window.testZLevelHover = function() {
        // 创建两个重叠的圆形，测试 hover 时的 zLevel 提升
        const circle1 = chart.createOverlay({
          name: 'circle',
          zLevel: 1,
          points: [
            { timestamp: dataList[dataList.length - 40].timestamp, value: dataList[dataList.length - 40].close },
            { timestamp: dataList[dataList.length - 35].timestamp, value: dataList[dataList.length - 35].close }
          ],
          styles: {
            circle: {
              color: 'rgba(255, 165, 0, 0.5)'
            }
          }
        })

        const circle2 = chart.createOverlay({
          name: 'circle',
          zLevel: 2,
          points: [
            { timestamp: dataList[dataList.length - 38].timestamp, value: dataList[dataList.length - 38].close },
            { timestamp: dataList[dataList.length - 33].timestamp, value: dataList[dataList.length - 33].close }
          ],
          styles: {
            circle: {
              color: 'rgba(128, 0, 128, 0.5)'
            }
          }
        })

        overlayCount += 2
        updateStatus('创建了 2 个重叠的圆形（橙、紫）。Hover 到任意一个，它应该提升到最上层。移出后恢复原始层级。')
      }

      window.testZLevelMultiple = function() {
        // 创建多个 overlay，快速 hover 测试
        const overlays = []
        for (let i = 0; i < 3; i++) {
          const offset = 45 + i * 3
          overlays.push(chart.createOverlay({
            name: 'segment',
            zLevel: i + 1,
            points: [
              { timestamp: dataList[dataList.length - offset].timestamp, value: dataList[dataList.length - offset].high },
              { timestamp: dataList[dataList.length - (offset - 5)].timestamp, value: dataList[dataList.length - (offset - 5)].low }
            ],
            styles: {
              line: {
                size: 10,
                color: i === 0 ? '#ff0000' : i === 1 ? '#00ff00' : '#0000ff'
              }
            }
          }))
        }

        overlayCount += 3
        updateStatus('创建了 3 条线段（红、绿、蓝）。快速 hover 不同的线段，测试 zLevel 是否能正确恢复。')
      }

      // 6. Batch Operations
      window.createMultipleOverlays = function() {
        for (let i = 0; i < 5; i++) {
          const offset = 10 + i * 5
          chart.createOverlay({
            name: 'textLog',
            extendData: `批量 #${i + 1}`,
            points: [{
              timestamp: dataList[dataList.length - offset].timestamp,
              value: dataList[dataList.length - offset].high + i * 2
            }]
          })
        }
        overlayCount += 5
        updateStatus(`批量创建了 5 个覆盖物，总计 ${overlayCount} 个`)
      }

      window.clearAllOverlays = function() {
        chart.removeOverlay()
        overlayCount = 0
        updateStatus('已清除所有覆盖物')
      }

      // 自动运行基础测试
      /* setTimeout(() => {
        console.log('🚀 开始自动测试...')
        testMainPaneText()
        setTimeout(() => testMainPaneLine(), 500)
        setTimeout(() => testHorizontalRayLine(), 1000)
        setTimeout(() => testParallelogram(), 1500)
        setTimeout(() => testSubPaneText(), 2000)
        setTimeout(() => {
          updateStatus('自动测试完成！请手动测试交互功能 - 尝试拖动平行四边形的前两个控制点')
        }, 2500)
      }, 1000) */
    </script>
  </body>
</html>
