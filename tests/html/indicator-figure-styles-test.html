<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indicator Figure Styles Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #chart {
      width: 100%;
      height: 600px;
    }
    .controls {
      margin-bottom: 20px;
    }
    button {
      margin-right: 10px;
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="controls">
    <h2>Indicator Figure Styles Test</h2>
    <p><strong>测试 styles.figures 的直接覆盖行为（不合并）</strong></p>
    <p>
      <button onclick="testHideDIF()">1. Hide DIF</button>
      <button onclick="testChangeDEAColor()">2. Change DEA to Red</button>
      <button onclick="testShowDIF()">3. Show DIF (覆盖之前的配置)</button>
    </p>
    <p>
      <button onclick="testResetToEmpty()">Reset: Empty Object {}</button>
      <button onclick="testResetToUndefined()">Reset: Undefined</button>
    </p>
    <div id="log" style="margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 4px; font-family: monospace; font-size: 12px;"></div>
  </div>
  <div id="chart"></div>

  <script type="module">
    import { init } from '../../dist/index.js'
    import { generated } from '../js/dataSource.js'

    const chart = init('chart')
    chart.applyNewData(generated())

    // Add MACD indicator
    chart.createIndicator('MACD', false, { id: '11' })

    const log = (msg) => {
      const logEl = document.getElementById('log')
      const time = new Date().toLocaleTimeString()
      logEl.innerHTML = `[${time}] ${msg}<br>` + logEl.innerHTML
      console.log(msg)
    }

    // Test functions
    window.testHideDIF = () => {
      chart.overrideIndicator({
        name: 'MACD',
        styles: {
          figures: {
            dif: { visible: false }
          }
        }
      }, '11')
      log('✅ Hide DIF - figures: { dif: { visible: false } }')
    }

    window.testShowDIF = () => {
      chart.overrideIndicator({
        name: 'MACD',
        styles: {
          figures: {
            dif: { visible: true }
          }
        }
      }, '11')
      log('✅ Show DIF - figures: { dif: { visible: true } } (之前的 DEA 配置被覆盖)')
    }

    window.testChangeDEAColor = () => {
      chart.overrideIndicator({
        name: 'MACD',
        styles: {
          figures: {
            dea: { color: '#FF0000' }
          }
        }
      }, '11')
      log('✅ Change DEA to Red - figures: { dea: { color: "#FF0000" } } (之前的 DIF 配置被覆盖)')
    }

    window.testResetToEmpty = () => {
      chart.overrideIndicator({
        name: 'MACD',
        styles: {
          figures: {}
        }
      }, '11')
      log('✅ Reset to Empty - figures: {} (所有自定义配置被清除)')
    }

    window.testResetToUndefined = () => {
      chart.overrideIndicator({
        name: 'MACD',
        styles: {
          figures: undefined
        }
      }, '11')
      log('✅ Reset to Undefined - figures: undefined (恢复默认行为)')
    }

    log('📊 MACD indicator created. Try the buttons above!')
  </script>
</body>
</html>
